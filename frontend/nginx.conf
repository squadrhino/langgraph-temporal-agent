# Static serving for the Angular build.
#
# Port 8080 rather than 80 so the container needs no privileged port and can
# run as the unprivileged nginx user.
#
# No API proxying here. The gateway routes /agent, /orders and the rest
# straight to the API Service by path, so this container only ever serves
# files -- see the HTTPRoute in k8s/app.yaml.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Angular router owns paths like /customer. A plain file lookup would
    # 404 on a deep link or a page refresh, so unmatched paths fall back to
    # index.html and the router resolves them client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change under the same name.
    location ~* \.(?:js|css|woff2?|png|svg|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached, or a deploy serves stale asset references.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
