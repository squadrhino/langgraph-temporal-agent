<a class="skip-link" href="#main">Skip to main content</a>

<app-header />

<main id="main" class="layout">
  <app-kpi-cards />
  <app-status-distribution />

  <div class="grid">
    <app-orders-table (newOrder)="newOrderDialog.showModal()" />
    <app-agent-chat />
  </div>

  <footer class="foot">
    <span>Computer Store API · FastAPI + Angular</span>
    <span class="foot__sep" aria-hidden="true">·</span>
    <a href="/docs" target="_blank" rel="noopener">OpenAPI docs</a>
    <span class="foot__sep" aria-hidden="true">·</span>
    <a routerLink="/customer">Customer portal</a>
  </footer>
</main>

<!-- Native dialog: Esc to dismiss, focus trapped, backdrop for free. -->
<dialog #newOrderDialog class="dialog" aria-label="Create a new order">
  <button
    class="dialog__close"
    type="button"
    aria-label="Close"
    (click)="newOrderDialog.close()"
  >
    <app-icon name="close" />
  </button>
  <app-order-form (created)="newOrderDialog.close()" />
</dialog>
