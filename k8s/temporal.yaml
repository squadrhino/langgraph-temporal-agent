---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: agentops
spec:
  selector:
    app: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: agentops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.29.7
          ports:
            - containerPort: 7233
          env:
            - name: DB
              value: postgres12
            # Required: the image defaults DB_PORT to 3306 (MySQL).
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: postgres-db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: temporal-db-secret
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: temporal-db-secret
                  key: password
            # postgres.yaml pre-creates the databases and the temporal role has
            # no CREATEDB, so auto-setup must skip its CREATE DATABASE step.
            - name: SKIP_DB_CREATE
              value: "true"
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: agentops
spec:
  selector:
    app: temporal-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: agentops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-ui
  template:
    metadata:
      labels:
        app: temporal-ui
    spec:
      # Kubernetes injects a TEMPORAL_PORT=tcp://<ip>:7233 env var for the
      # 'temporal' Service, but the UI's config expects TEMPORAL_PORT to be an
      # integer and refuses to start. Disabling service links removes the whole
      # class of collision between Service names and app config env vars.
      enableServiceLinks: false
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.53.0
          ports:
            - containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
